# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Production-style service definitions
#
# Usage:
#   docker compose up --build          → start everything (first time)
#   docker compose up -d               → start in background
#   docker compose logs -f api         → follow API logs
#   docker compose down                → stop containers
#   docker compose down -v             → stop + delete volumes (wipe data)
#
# Seed data (after services are running):
#   docker compose exec api python scripts/seed_database.py
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: fashion_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"       # Exposed to host for local dev tools (Compass, mongosh)
    volumes:
      - mongo_data:/data/db # Persistent storage — survives container restarts
    environment:
      MONGO_INITDB_DATABASE: fashion_commerce
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # Use the lean runtime stage, not the builder
    image: fashion-commerce-api:latest
    container_name: fashion_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB URI uses the service name 'mongo' — Docker's internal DNS
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: fashion_commerce
      APP_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      mongo:
        condition: service_healthy   # Don't start until MongoDB is accepting connections
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
